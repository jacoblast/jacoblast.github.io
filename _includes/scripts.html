  <script>
  // ── Hero sequence ──────────────────────────────────
  document.querySelectorAll('.hero-seq').forEach((el, i) => {
    setTimeout(() => el.classList.add('visible'), 50 + i * 80);
  });

  // ── Star rating animation ───────────────────────────
  const heroReviews = document.querySelector('.hero-reviews');
  if (heroReviews) {
    const starObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          setTimeout(() => heroReviews.classList.add('stars-animate'), 300);
          starObs.unobserve(heroReviews);
        }
      });
    }, { threshold: 0.8 });
    starObs.observe(heroReviews);
  }

  // ── Mobile CTA bar: reveal after scrolling past the hero ──
  const mobileCtaBar = document.querySelector('.mobile-cta-bar');
  const heroSection = document.querySelector('.hero');
  if (mobileCtaBar && heroSection && 'IntersectionObserver' in window) {
    const ctaObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        mobileCtaBar.classList.toggle('is-visible', !entry.isIntersecting);
      });
    }, { threshold: 0 });
    ctaObs.observe(heroSection);
  } else if (mobileCtaBar) {
    mobileCtaBar.classList.add('is-visible');
  }

  // ── Service card wave ───────────────────────────────
  const packageGrid = document.querySelector('.package-grid');
  if (packageGrid) {
    const cardWaveObs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const cards = packageGrid.querySelectorAll('.card-wave');
          cards.forEach((card, i) => {
            setTimeout(() => card.classList.add('in-view'), i * 160);
          });
          cardWaveObs.unobserve(packageGrid);
        }
      });
    }, { threshold: 0.15 });
    cardWaveObs.observe(packageGrid);
  }

  // ── Scroll reveals ─────────────────────────────────
  const revealObs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const delay = el.dataset.delay || 0;
        setTimeout(() => el.classList.add('in-view'), delay);
        revealObs.unobserve(el);
      }
    });
  }, { threshold: 0.10 });

  document.querySelectorAll('.reveal, .string-divider').forEach(el => revealObs.observe(el));

  // ── Header shrink + smart hide on scroll ───────────
  const siteHeader = document.getElementById('site-header');
  let navHidden = false;
  let lastScrollY = 0;

  // ── Hero parallax ───────────────────────────────────
  const heroBg = document.querySelector('.hero-bg');
  window.addEventListener('scroll', () => {
    const y = window.scrollY;
    siteHeader.classList.toggle('scrolled', y > 60);
    if (heroBg) heroBg.style.transform = `translateY(${y * 0.28}px)`;

    if (!siteHeader.classList.contains('nav-open')) {
      if (y < 150) {
        if (navHidden) {
          navHidden = false;
          siteHeader.classList.remove('nav-hidden');
        }
      } else if (!navHidden && y > lastScrollY + 5) {
        navHidden = true;
        siteHeader.classList.add('nav-hidden');
      } else if (navHidden && y < lastScrollY - 5) {
        navHidden = false;
        siteHeader.classList.remove('nav-hidden');
      }
    }
    lastScrollY = y;
  }, { passive: true });

  // ── Contact form ────────────────────────────────────
  const contactForm = document.getElementById('contact-form');
  const contactModal = document.getElementById('contact-modal');
  const contactModalClose = document.getElementById('contact-modal-close');

  if (contactForm && contactModal) {
    contactForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = new FormData(contactForm);
      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          body: data
        });
        if (res.ok) {
          contactForm.reset();
          contactModal.removeAttribute('hidden');
        }
      } catch (_) {}
    });

    contactModalClose.addEventListener('click', () => contactModal.setAttribute('hidden', ''));
    contactModal.addEventListener('click', (e) => {
      if (e.target === contactModal) contactModal.setAttribute('hidden', '');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !contactModal.hasAttribute('hidden')) {
        contactModal.setAttribute('hidden', '');
      }
    });
  }

  // ── Testimonials carousel ───────────────────────────
  document.querySelectorAll('[data-carousel]').forEach(carousel => {
    const viewport = carousel.querySelector('[data-carousel-viewport]');
    const track = carousel.querySelector('[data-carousel-track]');
    const controls = carousel.querySelector('[data-carousel-controls]');
    const prevBtn = carousel.querySelector('[data-carousel-prev]');
    const nextBtn = carousel.querySelector('[data-carousel-next]');
    const dotsWrap = carousel.querySelector('[data-carousel-dots]');
    const slides = Array.from(track.children);
    if (!slides.length) return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let perView = 1;
    let numPages = 1;
    let dots = [];

    const step = () => {
      const w = slides[0].getBoundingClientRect().width;
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      return w + gap;
    };
    // Leftmost card index for a page, clamped so the final page ends flush with the row.
    const pageStartIndex = (p) => Math.min(p * perView, Math.max(0, slides.length - perView));
    const currentPage = () => {
      const idx = Math.round(viewport.scrollLeft / step());
      return Math.max(0, Math.min(Math.round(idx / perView), numPages - 1));
    };
    const scrollToPage = (p) => {
      const clamped = Math.max(0, Math.min(p, numPages - 1));
      viewport.scrollTo({ left: pageStartIndex(clamped) * step(), behavior: reduceMotion ? 'auto' : 'smooth' });
    };

    const update = () => {
      const page = currentPage();
      dots.forEach((d, i) => d.setAttribute('aria-current', i === page ? 'true' : 'false'));
      prevBtn.disabled = page <= 0;
      nextBtn.disabled = page >= numPages - 1;
    };

    const buildDots = () => {
      dotsWrap.innerHTML = '';
      dots = [];
      for (let i = 0; i < numPages; i++) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'carousel-dot';
        b.setAttribute('aria-label', 'Go to review set ' + (i + 1) + ' of ' + numPages);
        b.addEventListener('click', () => scrollToPage(i));
        dotsWrap.appendChild(b);
        dots.push(b);
      }
    };

    const setup = () => {
      const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
      const w = slides[0].getBoundingClientRect().width;
      perView = Math.max(1, Math.round((viewport.clientWidth + gap) / (w + gap)));
      numPages = Math.max(1, Math.ceil(slides.length / perView));
      if (slides.length <= perView) {
        controls.hidden = true;
        prevBtn.hidden = true;
        nextBtn.hidden = true;
        viewport.style.overflowX = 'hidden';
        return;
      }
      controls.hidden = false;
      prevBtn.hidden = false;
      nextBtn.hidden = false;
      viewport.style.overflowX = '';
      buildDots();
      update();
    };

    prevBtn.addEventListener('click', () => scrollToPage(currentPage() - 1));
    nextBtn.addEventListener('click', () => scrollToPage(currentPage() + 1));
    viewport.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); scrollToPage(currentPage() - 1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); scrollToPage(currentPage() + 1); }
    });

    let scrollRaf;
    viewport.addEventListener('scroll', () => {
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = requestAnimationFrame(update);
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(setup, 150);
    });

    setup();
  });

  // ── FAQ accordion ───────────────────────────────────
  document.querySelectorAll('.faq-trigger').forEach(trigger => {
    trigger.addEventListener('click', () => {
      const item = trigger.closest('.faq-item');
      const body = item.querySelector('.faq-body');
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(open => {
        open.classList.remove('open');
        open.querySelector('.faq-body').style.maxHeight = '';
        open.querySelector('.faq-trigger').setAttribute('aria-expanded', 'false');
      });
      if (!isOpen) {
        item.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
        trigger.setAttribute('aria-expanded', 'true');
      }
    });
  });
  </script>
