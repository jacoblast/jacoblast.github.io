- name: "Sarah S."
  text: "Jacob tuned my very special family piano with such care to make sure it sounded amazing. The best piano tuner I've ever had. We will definitely use him every time. He played some beautiful Scott Joplin after—a mini concert in my house. Highly recommend!"
  date: "March 2026"

- name: "Michael D."
  text: "I've had Jacob do several tunings and repairs on two pianos, and I'm consistently happy with the results. I'm always more excited to play after his attention. He's deeply knowledgeable and passionate, taking many factors into account—not just doing what a tuning app says. He can tell you exactly what he's doing and why. A great player!"
  date: "March 2026"

# - name: "Lisa S."
  # text: "Our piano sounds better than it has in years. Jacob was kind, knowledgeable, and went above and beyond to both answer our questions and ensure that our instrument sounded amazing. We will happily have him back the next time our piano needs tuning."
  # date: "March 2026"

- name: "TJ T."
  text: "Jacob beautifully tuned my piano and brought the life back into it with a real enthusiasm for the craft. He went above and beyond in explaining what he was doing and why. An absolute saint of a piano tuner, who truly enjoys the work he is doing. Highly recommend."
  date: "March 2026"

- name: "Ryan Sowers, Certified Tuning Examiner, Piano Technicians Guild"
  text: "I've been a piano technician for over 30 years and serve as a Certified Tuning Examiner for the Piano Technicians Guild. It's rare to meet someone with Jacob's depth of understanding. His command of aural tuning is exceptional, and he's a generous collaborator and exceptional musician. I'm genuinely excited to see Jacob carrying the torch into the future of our craft."
  date: "March 2026"