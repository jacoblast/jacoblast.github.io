- name: "Ryan Sowers, RPT"
  text: "I've been a piano technician for over 30 years and serve as a Certified Tuning Examiner for the Piano Technicians Guild. It's rare to meet someone with Jacob's depth of understanding... I'm genuinely excited to see Jacob carrying the torch into the future of our craft."
  date: "July 2026"

- name: "Lon Gould"
  text: "Thoroughly knowledgeable technician with multiple potential solutions. I've been playing piano for 74 years, and spent time working for Yamaha in the 80's... Jacob did a remarkable job inspecting, tuning, regulating, and handling a rather considerable pitch raise. I'm impressed!!"
  date: "August 2026"

- name: "Sara Schultz"
  text: "Jacob came over and tuned my very special family piano. He took such care to make sure that it sounded amazing, checking every single key and the alignment of everything inside... And he played some beautiful Scott Joplin after he finished tuning my piano. Mini concert in my house."
  date: "March 2026"

- name: "Joy Riznikove"
  text: "He tuned our extremely out of tune century old piano. He was incredibly knowledgeable and graceful. I will be having him back out to tune again! Absolutely recommend this company to anyone interested in having their piano tuned"
  date: "August 2026"

- name: "Michael Dougherty"
  text: "I've asked Jacob to do several tunings and repairs on two pianos, and I've consistently been happy with the results... He's deeply knowledgeable and passionate about the art and science of tuning, not just doing what a tuning app says. And he's a great player!"
  date: "March 2026"

- name: "Lo Nathamundi"
  text: "Jacob is amazing 🤩. He expertly tuned my old spinet piano 🎹 and had it sounding at least 9 times better than when he started. Friendly, professional, brilliant, and down-to-earth. It was fun to watch him work in devoted absorption to the craft. Highly recommend."
  date: "March 2026"

- name: "Helene Vandeberg"
  text: "Jacob was so meticulous tuning my very old Wurletzer Spinet Piano. It had not been tuned for many years! He also repaired the music stand which needed screws... after completing the work, he gave my Granddaughter and I a little concert on my lovely sounding piano."
  date: "August 2026"

- name: "Nicole Smith"
  text: "Jacob repaired a stuck key and tuned my extremely flat piano. Now it sounds beautiful! He didn't mind my hovering and taught me things about my piano and how to improve the sound even more... I'm happy to have found a professional I can trust to keep my piano in good order."
  date: "August 2026"

- name: "TJ Thompson"
  text: "Jacob beautifully tuned my piano and brought the life back into it with a real enthusiasm for the craft... graciously came back for a second visit to re-tweak a few keys on my old piano, and declared the second visit was free of charge. An absolute saint of a piano tuner."
  date: "March 2026"

- name: "Stephanie Davidson"
  text: "Jacob was very helpful with communication when I inquired about an old upright that he worked on. The piano sounded so AMAZING...it was honestly hard to believe that it was an older piano... Jacob is certified from the Artisan Piano School, and they train EXCELLENT technicians."
  date: "June 2026"

- name: "Judy Froemke"
  text: "My experience with Jacob of Whole Tone Piano Works was excellent. He came on time; he was diligent with tuning our old upright piano; he played lovely tunes while tuning the keys... and then, per my request, he played two pieces for family members. It was so nice."
  date: "July 2026"

- name: "Paige Rasmussen"
  text: "If I could give more stars I would. Jacob was super responsive when setting up the appointment (even when I inquired last minute), thorough, and knowledgeable... Took the time to ensure I understood what he'd done and how to care for my piano. Made something old sound new again."
  date: "July 2026"
